[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teamsync-server"
dynamic = ["version"]
description = "TeamSync（同频）后端服务"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "bcrypt>=4.2,<6",
    "fastapi>=0.115",
    "PyJWT>=2.9,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "app/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
