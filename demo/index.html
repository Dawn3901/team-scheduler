<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>同频 TeamSync · 团队日程演示</title>
  <meta name="description" content="TeamSync 团队共享日程静态演示：虚拟团队、活动、RSVP、忙闲与任务。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></symbol>
    <symbol id="i-check-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3 2.8-5 6-5s5.4 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.5.4 4.2 2.2 4.7 4.8"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="17" r="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3L12 4z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16M7 12h10M10 19h4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14 6l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c.6-3 2.8-5 6-5s5.4 2 6 5"/><path d="M18 8v6M15 11h6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="brand-text"><strong>同频</strong><span>TeamSync</span></div>
        <span class="demo-chip">DEMO</span>
      </div>

      <button class="team-switcher" data-action="switch-team" title="切换团队">
        <span class="team-avatar">软</span>
        <span class="team-info"><strong>软工大作业</strong><small>3 位成员 · TS8K2M4Q</small></span>
        <svg class="icon"><use href="#i-chevron-down"></use></svg>
      </button>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item active" data-nav="calendar">
          <svg class="icon"><use href="#i-calendar"></use></svg><span>团队日历</span><kbd>1</kbd>
        </button>
        <button class="nav-item" data-nav="tasks">
          <svg class="icon"><use href="#i-check-square"></use></svg><span>任务看板</span><kbd>2</kbd>
        </button>
        <button class="nav-item" data-nav="members">
          <svg class="icon"><use href="#i-users"></use></svg><span>团队成员</span><kbd>3</kbd>
        </button>
        <button class="nav-item" data-nav="notifications">
          <svg class="icon"><use href="#i-bell"></use></svg><span>通知中心</span><em class="nav-badge" id="nav-badge">3</em>
        </button>
        <button class="nav-item" data-nav="settings">
          <svg class="icon"><use href="#i-settings"></use></svg><span>团队设置</span>
        </button>
      </nav>

      <div class="sidebar-section">
        <p class="sidebar-label">快捷入口</p>
        <button class="quick-link" data-action="quick-my-week"><span class="dot indigo"></span>我的本周</button>
        <button class="quick-link" data-action="quick-pending"><span class="dot amber"></span>待回应邀请<span class="count" id="pending-count">2</span></button>
        <button class="quick-link" data-action="quick-conflict"><span class="dot coral"></span>冲突演示</button>
        <button class="quick-link" data-action="open-tour"><span class="dot teal"></span>演示导览</button>
      </div>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar avatar-lin">林</div>
          <div class="user-meta"><strong>林知远</strong><small>Owner · 在线</small></div>
          <span class="online-dot" title="在线"></span>
        </div>
        <div class="demo-note"><svg class="icon"><use href="#i-spark"></use></svg>静态演示 · 虚拟数据</div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim" data-action="close-sidebar" aria-hidden="true"></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu" data-action="toggle-sidebar" aria-label="打开菜单">
            <svg class="icon"><use href="#i-menu"></use></svg>
          </button>
          <div class="breadcrumb"><span>软工大作业</span><svg class="icon"><use href="#i-chevron-right"></use></svg><strong id="breadcrumb">团队日历</strong></div>
        </div>

        <div class="search-wrap" id="search-wrap">
          <svg class="icon search-icon"><use href="#i-search"></use></svg>
          <input id="global-search" type="search" placeholder="搜索活动、任务或成员…" autocomplete="off" aria-label="搜索">
          <kbd class="search-kbd">Ctrl K</kbd>
          <div class="search-results" id="search-results" hidden></div>
        </div>

        <div class="topbar-right">
          <span class="data-pill"><span class="pulse"></span>演示数据</span>
          <button class="icon-btn bell-btn" data-action="toggle-notifications" aria-label="通知">
            <svg class="icon"><use href="#i-bell"></use></svg>
            <span class="badge" id="bell-badge">3</span>
          </button>
          <button class="avatar avatar-lin avatar-btn" data-action="open-profile" aria-label="个人资料">林</button>
        </div>
        <div class="notification-popover" id="notification-popover" hidden></div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
